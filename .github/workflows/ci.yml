name: CI
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: applytrack
          POSTGRES_PASSWORD: applytrack
          POSTGRES_DB: applytrack_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U applytrack -d applytrack_test"
          --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://applytrack:applytrack@localhost:5432/applytrack_test
      TEST_DATABASE_URL: postgresql+psycopg://applytrack:applytrack@localhost:5432/applytrack_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.lock.txt
      - run: alembic upgrade head
      - run: python -m pytest -q
      - run: alembic check
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
      - run: npm test
      - run: npm run build

  production-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --build-arg VITE_SUPABASE_URL=https://example.supabase.co --build-arg VITE_SUPABASE_PUBLISHABLE_KEY=public-ci-placeholder -t applytrack:ci .
      - run: |
          docker run -d --name applytrack -p 8000:8000 -e SUPABASE_URL=https://example.supabase.co -e OWNER_ID=11111111-1111-4111-8111-111111111111 applytrack:ci
          for attempt in $(seq 1 30); do
            if curl --fail http://localhost:8000/health; then break; fi
            sleep 1
          done
          curl --fail http://localhost:8000/health
          curl --fail http://localhost:8000/
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/api/applications)" = 401
